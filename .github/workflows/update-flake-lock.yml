name: update-flake-lock

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        input:
          - nixpkgs
          - flake-parts
          - import-tree
          - home-manager
          - nix-darwin
          - chaotic
          - nixos-apple-silicon
          - firefox-addons
          - pi
          - nix-index-database
          - treefmt-nix
          - git-hooks-nix
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        id: update
        with:
          token: ${{ secrets.FLAKE_LOCK_TOKEN }}
          inputs: ${{ matrix.input }}
          branch: update-flake-lock/${{ matrix.input }}
          pr-title: "chore(flake): update ${{ matrix.input }}"
          pr-labels: |
            automerge
            dependencies
          commit-msg: "chore(flake): update ${{ matrix.input }}"
      - if: steps.update.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.FLAKE_LOCK_TOKEN }}
          PR_NUMBER: ${{ steps.update.outputs.pull-request-number }}
        # The PR's own state is the only thing that ends this step, so a
        # transient API error can't let the next input branch off a main
        # that this PR has yet to land on.
        run: |
          for _ in {1..120}; do
            if info=$(gh pr view "$PR_NUMBER" --json state,mergeStateStatus,autoMergeRequest,statusCheckRollup --jq '[.state, .mergeStateStatus, (.autoMergeRequest != null), ([.statusCheckRollup[] | select(.conclusion == "FAILURE" or .conclusion == "CANCELLED" or .conclusion == "TIMED_OUT")] | length)] | @tsv'); then
              read -r state merge auto failed <<< "$info"
              case "$state" in
                MERGED)
                  exit 0
                  ;;
                CLOSED)
                  echo "PR #$PR_NUMBER closed without merging" >&2
                  exit 1
                  ;;
              esac
              if [ "$failed" -gt 0 ]; then
                echo "Checks failed on PR #$PR_NUMBER" >&2
                exit 1
              fi
              [ "$auto" = true ] || gh pr merge --auto --squash "$PR_NUMBER" || true
              [ "$merge" != BEHIND ] || gh pr update-branch "$PR_NUMBER" || true
            fi
            sleep 10
          done

          echo "Timed out waiting for PR #$PR_NUMBER to merge" >&2
          exit 1
      - if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "update-flake-lock failed: ${{ matrix.input }}"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue list --state open --search "in:title \"$TITLE\"" --json number,title --jq '.[] | select(.title == env.TITLE) | .number' |
            while read -r issue; do
              gh issue close "$issue" --comment "Resolved by $RUN_URL"
            done
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "update-flake-lock failed: ${{ matrix.input }}"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$RUN_URL"
          fi
