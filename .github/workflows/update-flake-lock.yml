name: update-flake-lock

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        input:
          - nixpkgs
          - flake-parts
          - import-tree
          - home-manager
          - nix-darwin
          - chaotic
          - firefox-addons
          - treefmt-nix
          - git-hooks-nix
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        id: update
        with:
          token: ${{ secrets.FLAKE_LOCK_TOKEN }}
          inputs: ${{ matrix.input }}
          branch: update-flake-lock/${{ matrix.input }}
          pr-title: "chore(flake): update ${{ matrix.input }}"
          pr-labels: |
            automerge
            dependencies
          commit-msg: "chore(flake): update ${{ matrix.input }}"
      - if: steps.update.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.FLAKE_LOCK_TOKEN }}
          PR_NUMBER: ${{ steps.update.outputs.pull-request-number }}
        run: |
          gh pr merge --auto --squash "$PR_NUMBER"
          gh pr checks --watch --fail-fast --interval 15 "$PR_NUMBER"

          for _ in {1..60}; do
            state=$(gh pr view "$PR_NUMBER" --json state --jq .state)
            case "$state" in
              MERGED)
                exit 0
                ;;
              CLOSED)
                echo "PR #$PR_NUMBER closed without merging" >&2
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "Timed out waiting for PR #$PR_NUMBER to merge" >&2
          exit 1
