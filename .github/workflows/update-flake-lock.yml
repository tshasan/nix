name: update-flake-lock

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        input:
          - nixpkgs
          - flake-parts
          - import-tree
          - home-manager
          - nix-darwin
          - chaotic
          - firefox-addons
          - treefmt-nix
          - git-hooks-nix
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        id: update
        with:
          token: ${{ secrets.FLAKE_LOCK_TOKEN }}
          inputs: ${{ matrix.input }}
          branch: update-flake-lock/${{ matrix.input }}
          pr-title: "chore(flake): update ${{ matrix.input }}"
          pr-labels: |
            automerge
            dependencies
          commit-msg: "chore(flake): update ${{ matrix.input }}"
      - if: steps.update.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.FLAKE_LOCK_TOKEN }}
        run: gh pr merge --auto --squash "${{ steps.update.outputs.pull-request-number }}"
